:root{
  --bg:#F7EEDE; --surface:#FFFBF4; --surface-2:#F4E6CE; --ink:#3A271B; --muted:#7D6052; --line:#E8D5BB;
  --banana:#F1D7A1; --banana-ink:#3A271B; --banana-soft:#FBEFCB;
  --fudge:#621813; --fudge-ink:#F8ECD8; --fudge-muted:#DDB0A6; --fudge-line:#7E2A22; --fudge-field:#72201A;
  --teal:#D99FBA; --teal-ink:#3A271B; --teal-soft:#F7E1EB; --teal-strong:#9C3F68; --chart:#621813;
  --ok:#2E7D4F; --ok-soft:#E1F2E7; --bad:#B3261E; --bad-soft:#FBE4E2; --warn:#9A5800; --warn-soft:#FFEFD3;

  --font:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C110E; --surface:#2A1A14; --surface-2:#33211A; --ink:#F4E6CE; --muted:#C4A898; --line:#47302A;
    --banana:#F1D7A1; --banana-ink:#2A1A14; --banana-soft:#3D3019;
    --fudge:#5A1611; --fudge-ink:#F8ECD8; --fudge-muted:#D7A79D; --fudge-line:#7A2A22; --fudge-field:#6B1D17;
    --teal:#D99FBA; --teal-ink:#2A1A14; --teal-soft:#3E2331; --teal-strong:#EDB6CF; --chart:#D99FBA;
    --ok:#62C48F; --ok-soft:#14301F; --bad:#FF8A80; --bad-soft:#3A1614; --warn:#F5B451; --warn-soft:#3A2A10;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C110E; --surface:#2A1A14; --surface-2:#33211A; --ink:#F4E6CE; --muted:#C4A898; --line:#47302A;
  --banana:#F1D7A1; --banana-ink:#2A1A14; --banana-soft:#3D3019;

  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:3px solid var(--teal-strong);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8A2A22 0 30%,transparent 31%),radial-gradient(circle at 68% 60%,#F4E6CE 0 9%,transparent 10%),radial-gradient(circle at 40% 72%,#F4E6CE 0 7%,transparent 8%),#621813;flex:none;box-shadow:inset 0 0 0 3px #D99FBA}
.brand h1{font-size:19px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.tab[aria-current="page"]{background:var(--ink);color:var(--surface)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)} .sync.err{color:var(--bad)} .sync.local i{background:var(--warn)}
.banner{margin:12px 18px 0;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px}

/* Sell */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding:18px;align-items:start}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.cat .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cat[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 14px 12px;min-height:138px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .08s ease}
.tile:active:not(:disabled){transform:scale(.97)}
.tile .dot{width:30px;height:30px;border-radius:50%;background:var(--c);margin-bottom:6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.tile .dot,.cat .sw,.prow .dot,.cat-title i{outline:1px solid color-mix(in srgb, var(--ink) 22%, transparent);outline-offset:0}
.tile .t-name{font-weight:650;font-size:16px;line-height:1.2;flex:1}
.tile .t-price{font-weight:750;font-size:20px}
.tile .t-stock{font-size:13px;color:var(--muted)}
.tile .t-stock.low{color:var(--warn);font-weight:650}
.tile.incart{border-color:var(--banana);box-shadow:0 0 0 2px var(--banana),var(--shadow)}
.tile .qty-badge{position:absolute;top:10px;right:10px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--banana);color:var(--banana-ink);font-weight:750;display:grid;place-items:center}
.tile:disabled{cursor:not-allowed}
.tile.out{opacity:.5;filter:grayscale(1);box-shadow:none;background:var(--surface-2)}
.tile.out .t-stock{color:var(--ink);font-weight:700}

/* Ticket (order panel) */
.ticket{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);background:var(--fudge);color:var(--fudge-ink);border-radius:6px 6px 22px 22px;padding:22px 18px 18px;
  -webkit-mask:radial-gradient(circle 7px at 9px 0,#0000 98%,#000) -9px 0/18px 100% repeat-x;mask:radial-gradient(circle 7px at 9px 0,#0000 98%,#000) -9px 0/18px 100% repeat-x}
.ticket-handle{display:none}
.ticket-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ticket-head h2{font-size:20px;font-weight:700}
.link{background:none;border:0;color:inherit;text-decoration:underline;text-underline-offset:3px;padding:4px;font-size:14px;opacity:.85}
.ticket .fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ticket .field span{color:var(--fudge-muted)}
.ticket .field input{background:var(--fudge-field);border-color:var(--fudge-line);color:var(--fudge-ink)}
.ticket input::placeholder{color:var(--fudge-muted);opacity:.8}
.lines{list-style:none;margin:0;padding:0;max-height:min(42vh,380px);overflow:auto;border-top:1px dashed var(--fudge-line);border-bottom:1px dashed var(--fudge-line)}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--fudge-line)}
.line:last-child{border-bottom:0}
.line .l-name{font-weight:600}
.line .l-sum{font-weight:700;text-align:right}
.line .l-sub{font-size:13px;color:var(--fudge-muted)}
.stepper{display:flex;align-items:center;gap:6px;justify-self:end}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--fudge-line);background:var(--fudge-field);color:var(--fudge-ink);font-size:18px;font-weight:700;line-height:1}
.stepper b{min-width:22px;text-align:center}
.empty-ticket{padding:28px 0;text-align:center;color:var(--fudge-muted)}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 14px}
.total-row span{font-size:16px;color:var(--fudge-muted)}
.total-row strong{font-size:44px;font-weight:800;color:var(--banana);letter-spacing:-.02em;line-height:1}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Buttons & fields */
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.banana{background:var(--banana);color:var(--banana-ink)}
.btn.teal{background:var(--teal);color:var(--teal-ink)}
.btn.ink{background:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.big{width:100%;min-height:58px;font-size:18px}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:11px}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px}
.field span{color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--teal-strong);flex:none}

/* Pages */
.page{padding:18px;max-width:1100px;margin:0 auto}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:28px;font-weight:750}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:16px}
.toolbar .grow{flex:1;min-width:180px}
.summary{color:var(--muted);margin:0 0 12px;font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:18px;font-weight:700;margin-bottom:12px}
.list{display:flex;flex-direction:column;gap:8px}
.orow{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:4px 14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.orow .o-no{font-weight:700}
.orow .o-time{color:var(--muted);font-size:14px}
.orow .o-who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .o-who small{color:var(--muted);margin-left:6px}
.orow strong{font-size:17px;text-align:right}
.orow.void{opacity:.6}
.orow.void strong{text-decoration:line-through}
.pill{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.cash{background:var(--banana-soft);color:var(--ink)}
.pill.qr{background:var(--teal-soft);color:var(--teal-strong)}
.pill.void{background:var(--bad-soft);color:var(--bad)}
.pill.hidden{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--bad-soft);color:var(--bad)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty .btn{margin-top:12px}

/* Dashboard */
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.kpi span{color:var(--muted);font-size:14px}
.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.kpi.lead{background:var(--fudge);border-color:var(--fudge);color:var(--fudge-ink)}
.kpi.lead span{color:var(--fudge-muted)}
.kpi.lead b{color:var(--banana)}
.c-8{grid-column:span 8}.c-4{grid-column:span 4}.c-6{grid-column:span 6}.c-12{grid-column:1/-1}
.bars{display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:34px;background:var(--chart);border-radius:6px 6px 2px 2px;min-height:2px}
.bar.zero i{background:var(--line)}
.bar small{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:6px 0 12px}
.split .s-cash{background:var(--banana)} .split .s-qr{background:var(--teal)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend div{display:flex;justify-content:space-between;gap:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.best{display:flex;flex-direction:column;gap:10px}
.best-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:15px}
.best-row .track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.best-row .track i{display:block;height:100%;background:var(--c,var(--banana));border-radius:999px}
.best-row small{color:var(--muted)}
.mini{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.mini:last-child{border-bottom:0}
.diff-ok{color:var(--ok);font-weight:700}.diff-bad{color:var(--bad);font-weight:700}

/* Stock */
.prow{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:4px 14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px}
.prow .dot{width:22px;height:22px;border-radius:50%;background:var(--c)}
.prow .p-name{font-weight:650;min-width:0}
.prow .p-name small{display:block;color:var(--muted);font-weight:500}
.prow .p-stock{font-weight:750;font-size:18px;text-align:right;min-width:56px}
.prow .p-stock small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.prow .acts{display:flex;gap:6px}
.cat-title{font-size:15px;color:var(--muted);font-weight:650;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.cat-title i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* History */
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:16px;color:var(--ink)}
.lrow{display:grid;grid-template-columns:76px 128px 1fr auto;gap:4px 12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px}
.lrow .l-time{color:var(--muted);font-size:14px}
.lrow .pill{justify-self:start}
.lrow .l-what{min-width:0}
.lrow .l-what b{font-weight:650}
.lrow .l-what small{display:block;color:var(--muted);font-size:13.5px}
.l-delta{font-weight:800;font-size:17px;text-align:right;min-width:44px}
.pos-d{color:var(--ok)} .neg-d{color:var(--bad)}
.pill.lt-stock{background:var(--banana-soft);color:var(--ink)}
.pill.lt-sale{background:var(--teal-soft);color:var(--teal-strong)}
.pill.lt-void{background:var(--bad-soft);color:var(--bad)}
.pill.lt-edit{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.scrollx{overflow-x:auto}
.sumtab{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
.sumtab th{font-size:13px;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.sumtab td{padding:8px;text-align:right;border-bottom:1px solid var(--line)}
.sumtab th:first-child,.sumtab td:first-child{text-align:left}
.sumtab tr:last-child td{border-bottom:0}
.sumtab td.end{font-weight:800}
@media (max-width: 860px){
  .lrow{grid-template-columns:auto 1fr auto}
  .lrow .pill{grid-column:2;grid-row:1}
  .lrow .l-what{grid-column:1/3;grid-row:2}
  .lrow .l-delta{grid-column:3;grid-row:1/3}
}

/* Settings */
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.settings .card{display:flex;flex-direction:column;gap:12px}
.qr-prev{width:180px;aspect-ratio:1;border-radius:14px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;overflow:hidden;background:#fff}
.qr-prev img{width:100%;height:100%;object-fit:contain}
.note{font-size:14px;color:var(--muted);margin:0}

/* Modal */
#modal-root{position:fixed;inset:0;z-index:50;display:none}
#modal-root.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(22,12,6,.55)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--surface);border-radius:22px;padding:18px 20px 20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .16s ease-out}
.modal.wide{width:min(860px,calc(100% - 24px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}.tile{transition:none}}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.m-head h2{font-size:22px;font-weight:750}
.x{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.m-body{display:flex;flex-direction:column;gap:14px}
.due{display:flex;justify-content:space-between;align-items:baseline;background:var(--banana-soft);border-radius:16px;padding:14px 16px}
.due span{font-weight:600}
.due strong{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1}
.due.teal{background:var(--teal-soft)}
.due.teal strong{color:var(--teal-strong)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 6px;font-weight:700;font-size:16px}
.qbtn.alt{background:var(--banana-soft);border-color:transparent}
.change{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px}
.change span{color:var(--muted);font-weight:600}
.change strong{font-size:32px;font-weight:800}
.change strong.bad{color:var(--bad)}
.change strong.ok{color:var(--ok)}
.qr-layout{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.qr-card{background:#fff;border-radius:18px;padding:12px;border:1px solid var(--line);text-align:center;color:#2E1B12}
/* File pickers stay in the page (some app web views ignore taps on fully hidden inputs) */
input[type="file"][hidden],input[type="file"].vh{display:block!important;position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;pointer-events:none!important}
label:has(> input[type="file"]){position:relative}
.qr-zoom{display:block;width:100%;border:0;padding:0;background:none;cursor:zoom-in;position:relative}
.qr-zoom img{display:block}
.qr-zoom-tip{display:block;font-size:12.5px;color:#7B6B60;margin-top:4px}
.shot-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.shot-row .btn{flex:1;min-height:46px}
.qrv{position:fixed;inset:0;z-index:80;background:#fff;color:#111;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 0 calc(12px + env(safe-area-inset-bottom,0px))}
.qrv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px}
.qrv-amt{font-size:20px;font-weight:600}
.qrv-amt b{font-size:30px;font-weight:800;margin-left:6px}
.qrv-x{border:2px solid #111;background:#fff;color:#111;border-radius:999px;padding:8px 18px;font-weight:700;font-size:16px}
.qrv-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;min-height:0}
.qrv-track::-webkit-scrollbar{display:none}
.qrv-slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 16px;min-width:0}
.qrv-slide img{width:min(92vw,68vh);height:auto;aspect-ratio:1;object-fit:contain;background:#fff}
.qrv-bank{font-size:26px;font-weight:800}
.qrv-acct{font-size:18px;color:#333}
.qrv-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 16px}
.qrv-nav button{width:52px;height:52px;border-radius:50%;border:2px solid #111;background:#fff;color:#111;display:grid;place-items:center}
.qrv-nav button:disabled{opacity:.25}
.qrv-dots{display:flex;gap:8px}
.qrv-dots i{width:10px;height:10px;border-radius:999px;background:#ccc}
.qrv-dots i.on{background:#111;width:26px}
.qrv-tip{text-align:center;font-size:14px;color:#444;margin:4px 16px 0}
.qr-card img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.qr-card .acct{margin:8px 0 0;font-weight:650;font-size:15px}
.qr-missing{aspect-ratio:1;display:grid;place-items:center;padding:16px;color:#7B6B60;font-size:14px;border:1px dashed #E4DED6;border-radius:12px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:14px}
.steps .check{margin-top:1px}
.steps li::marker{font-weight:800;color:var(--teal-strong)}
.photo-pick{display:flex;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;background:var(--surface-2)}
.photo-pick img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.photo-pick .ph{width:64px;height:64px;border-radius:10px;background:var(--teal-soft);display:grid;place-items:center;color:var(--teal-strong);font-size:26px;flex:none}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}

/* Number pad & slider */
.numfield{display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:24px;font-weight:750;min-height:54px;color:var(--ink)}
.numfield i{font-style:normal;color:var(--muted);font-weight:600;font-size:.8em}
.numfield.active{border-color:var(--teal-strong);box-shadow:0 0 0 3px var(--teal-soft)}
.numfield.empty b{color:var(--muted);font-weight:600}
.numfield.active b::after{content:"";display:inline-block;width:2px;height:.9em;background:var(--teal-strong);margin-left:3px;vertical-align:-1px}
.numfield.big{justify-content:center;font-size:34px}
.pad{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;grid-auto-rows:56px;gap:8px}
.pkey{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;font-size:24px;font-weight:700;color:var(--ink)}
.pkey:active{background:var(--banana-soft)}
.pkey:disabled{opacity:.3;cursor:not-allowed}
.pkey.side{grid-column:4;font-size:16px;background:var(--surface)}
.pkey[data-k="back"]{grid-row:1/3;font-size:24px}
.pkey[data-k="clear"]{grid-row:3/5}
.stepper-row{display:grid;grid-template-columns:60px 1fr 60px;gap:8px}
.stepbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;font-size:28px;font-weight:700;color:var(--ink)}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0;--fill:0%}
.slider::-webkit-slider-runnable-track{height:12px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(var(--fudge),var(--fudge)) 0 0/var(--fill) 100% no-repeat,var(--surface-2)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;background:var(--surface);border:4px solid var(--fudge);box-shadow:var(--shadow)}
.slider::-moz-range-track{height:12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.slider::-moz-range-progress{height:12px;border-radius:999px;background:var(--fudge)}
.slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--surface);border:4px solid var(--fudge)}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:-8px}
.linkbtn{background:none;border:0;color:var(--teal-strong);font-weight:650;text-decoration:underline;text-underline-offset:3px;padding:4px 0;align-self:flex-start;font-size:15px}

.pin-layer{position:fixed;inset:0;z-index:70}
/* Collab sellers */
.t-seller{font-size:12.5px;font-weight:650;color:var(--teal-strong);display:flex;align-items:center;gap:5px;line-height:1.2}
.t-seller i{width:8px;height:8px;border-radius:50%;background:var(--v);flex:none}
.cats.sellers{margin-bottom:8px}
.cat.seller[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.slip-seller{display:block;color:#8A7767;font-size:12.5px}
.vrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.vrow:last-of-type{border-bottom:0}
.vrow i{width:12px;height:12px;border-radius:50%;background:var(--v);flex:none}
.vrow b{flex:1;font-weight:650}
.vrow small{color:var(--muted)}
.vrow .acts{display:flex;gap:6px}
/* QR slider and QR list */
.qr-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px}
.qr-track::-webkit-scrollbar{display:none}
.qr-slide{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.qr-card .bank{font-weight:800;font-size:17px;margin-top:8px}
.qr-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.qr-arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.qr-arrow:disabled{opacity:.3;cursor:default}
.qr-dots{display:flex;gap:6px;justify-content:center;align-items:center;flex:1}
.qr-dots i{width:8px;height:8px;border-radius:999px;background:var(--line)}
.qr-dots i.on{background:var(--teal-strong);width:22px}
.qr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qr-item{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:4px;min-width:0}
.qr-item img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:4px}
.qr-item b{font-size:15px}
.qr-item small{color:var(--muted);font-size:13px}
.qr-item .acts{display:flex;gap:6px;margin-top:4px}
.qr-item .acts .btn{flex:1;padding:6px 8px}
/* Slip image and printing */
.slip-img{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:6px;border:1px solid var(--line)}
#print-area{display:none}
@media print{
  body.printing > *:not(#print-area){display:none!important}
  body.printing #print-area{display:block}
  body.printing #print-area img{width:var(--pw,80mm);max-width:100%;display:block}
}
.pin-layer .modal{width:min(400px,calc(100% - 24px))}

/* Order slip */
.slip{background:#FFFDF8;color:#2E1B12;border-radius:6px;padding:20px 18px;font-size:15px;border:1px solid #EADFCF;position:relative}
.slip-shop{font-size:22px;font-weight:800;text-align:center;line-height:1.1}
.slip-kind{text-align:center;color:#8A7767;font-size:13px;margin-top:2px}
.slip hr{border:0;border-top:1px dashed #CDBBA8;margin:12px 0}
.slip-meta{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.slip-meta strong{white-space:nowrap}
.slip table{width:100%;border-collapse:collapse}
.slip td{padding:3px 0;vertical-align:top}
.slip td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
.slip td small{color:#8A7767}
.slip-total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:22px}
.slip-pay{display:flex;justify-content:space-between;font-size:14px;color:#5A4638}
.slip-proof{margin-top:10px;display:flex;gap:10px;align-items:center;font-size:13px;color:#8A7767}
.slip-proof img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #EADFCF;cursor:zoom-in}
.slip-proof img.big{width:100%;height:auto;cursor:zoom-out}
.slip-proof.bigwrap{flex-direction:column;align-items:stretch}
.slip-foot{text-align:center;color:#8A7767;font-size:13px;margin-top:12px}
.slip-for{font-size:18px;font-weight:800;margin-top:6px}
.slip.wm::before{content:"";position:absolute;inset:0;background:var(--wm) center 42%/62% auto no-repeat;opacity:.08;pointer-events:none}
.slip > *:not(.stamp):not(.slip-corners){position:relative}
.slip-corners{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.slip-corners img{width:54px;height:54px;object-fit:contain}
.slip.corners .slip-shop,.slip.corners .slip-kind{padding:0 62px}
.slip-printed{font-size:12.5px;color:#8A7767;text-align:center;margin-top:4px}
.logo-row{display:flex;align-items:center;gap:12px}
.logo-prev{width:64px;height:64px;border-radius:12px;border:1px dashed var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;flex:none}
.logo-prev img{width:100%;height:100%;object-fit:contain}
.slip-status{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-top:6px}
.slip-status .todo{color:#9A5800} .slip-status .done{color:#2E7D4F}
.slip-social{margin-top:14px;text-align:center}
.slip-social-t{font-weight:700;font-size:14px}
.slip-qrs{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin-top:8px}
.slip-qrbox{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.slip-qrbox small{color:#8A7767}
.slip-qr{width:104px;height:104px;display:block}
.ful-todo{color:var(--warn);font-weight:650}
.ful-done{color:var(--ok);font-weight:650}
.stamp{position:absolute;top:56px;right:14px;transform:rotate(-10deg);border:3px solid #B3261E;color:#B3261E;font-weight:800;font-size:20px;padding:2px 10px;border-radius:8px;opacity:.85}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(480px,calc(100% - 24px))}
.toast.undo{display:flex;align-items:center;gap:14px;pointer-events:auto}
.toast.undo button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:6px 12px;font-weight:700;font-size:15px}
.t-hint{font-size:12.5px;color:var(--teal-strong);font-weight:650}
.toast{background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.toast.ok{background:var(--ok);color:#fff}

.loading{padding:60px 18px;text-align:center;color:var(--muted)}

/* Responsive */
@media (max-width: 980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c-8,.c-4,.c-6{grid-column:1/-1}
  .settings{grid-template-columns:1fr}
}
@media (max-width: 860px){
  .top{flex-wrap:wrap;padding:10px 14px;gap:10px}
  .tabs{order:3;margin-left:0;width:100%}
  .sync{margin-left:auto}
  .sell{grid-template-columns:minmax(0,1fr);padding:14px 14px 96px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .ticket{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:25;border-radius:6px 6px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:calc(88% - env(safe-area-inset-top,0px));overflow:auto;transform:translateY(calc(100% - 62px - env(safe-area-inset-bottom,0px)));transition:transform .22s ease}
  .ticket.open{transform:none}
  .ticket-handle{display:flex;width:100%;justify-content:space-between;align-items:center;background:none;border:0;color:var(--fudge-ink);padding:0 0 14px;font-weight:700;font-size:17px}
  .ticket-handle strong{color:var(--banana);font-size:22px}
  .qr-layout{grid-template-columns:1fr}
  .qr-card{max-width:280px;margin:0 auto}
  .orow{grid-template-columns:auto 1fr auto;}
  .orow .o-time{grid-column:2;grid-row:1;justify-self:start}
  .orow .o-who{grid-column:1/3;grid-row:2}
  .orow .pill{grid-column:3;grid-row:2;justify-self:end}
  .orow strong{grid-column:3;grid-row:1}
  .prow{grid-template-columns:auto 1fr auto}
  .prow .acts{grid-column:1/-1;justify-content:flex-end}
  .prow .p-price{display:none}
}
@media (max-width: 480px){
  .kpi b{font-size:24px}
  .quick{grid-template-columns:repeat(3,1fr)}
  .row2{grid-template-columns:1fr}
  .ticket .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.ticket{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span><h1 id="shop-name">rngwillbake</h1></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="sync" id="sync"><i></i><span>Connecting…</span></div>
</header>
<div id="banner"></div>
<main id="view"><div class="loading">Loading your shop…</div></main>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<div id="print-area" aria-hidden="true"></div>

(function(){
"use strict";

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);

const pad = (n, w) => String(n).padStart(w || 2, "0");

const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

const CAT_COLORS = {"banana pudding": "#E9C77F", "crinkles": "#3A271B", "cookies": "#B56F2F", "brownies": "#621813"};
const EXTRA = ["#D99FBA", "#A8506E", "#C98F5A", "#7D4A3A", "#E4B07E", "#B87A92"];
function catColor(c){
  const k = String(c || "Other").toLowerCase();
  if (CAT_COLORS[k]) return CAT_COLORS[k];
  let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return EXTRA[h % EXTRA.length];
}

/* ---------- state ---------- */
const S = {
  mode: "loading", sync: "connecting", slow: false,
  products: {}, orders: {}, closings: {}, settings: {}, logs: {},
  loaded: {}, cart: [], customer: "", note: "", cartOpen: false,
  tab: "sell", cat: "All", seller: "all", unlocked: false,
  ui: {ordDate: dayKey(Date.now()), ordFilter: "all", q: "", period: "today", hDate: dayKey(Date.now()), hFilter: "all", hItem: "", dSeller: "all"}
};
const DEFAULTS = {shopName: "rngwillbake", pin: "", qr: null, accountName: ""};
const cfg = () => Object.assign({}, DEFAULTS, S.settings);
let db = null, assets = null, downloads = null, sampleFn = null;

/* ---------- storage ---------- */
const LS_KEY = "bakeshop-pos-v1";
/* Device-only mode keeps every record in IndexedDB (large, per record); localStorage is only a fallback. */
const IDB_NAME = "rngwillbake-pos", IDB_STORES = ["products", "orders", "closings", "settings", "logs"];

  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => IDB_STORES.forEach(n => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); });

function loadLocalLS(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    S.products = d.products || {}; S.orders = d.orders || {}; S.closings = d.closings || {}; S.settings = d.settings || {}; S.logs = d.logs || {};
  } catch (e) { /* empty or blocked storage: start fresh */ }
}
async function loadLocal(){
  try {
    idb = await idbOpen();
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      await idbBulk(Object.assign({}, ...["products", "orders", "closings", "logs"].map(n => ({[n]: d[n] || {}})), {settings: d.settings ? {main: d.settings} : {}}));
      localStorage.removeItem(LS_KEY);

    for (const n of ["products", "orders", "closings", "logs"]) S[n] = await idbAll(n);

async function checkSpace(){

    if (!navigator.storage || !navigator.storage.estimate) return;
    const {usage, quota} = await navigator.storage.estimate();
    const full = quota ? usage / quota : 0;
    if ((full > 0.8) !== !!S.spaceLow) { S.spaceLow = full > 0.8; renderChrome(); }
  } catch (e) {}
}
let writeCount = 0;
async function localWrite(coll, id, data, del){
  if (!idb) { if (!saveLocal()) throw new Error("quota"); return; }
  await idbWrite(coll, coll === "settings" ? "main" : id, data, del);
  if (++writeCount % 20 === 0) checkSpace();
}
function saveLocal(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({products: S.products, orders: S.orders, closings: S.closings, settings: S.settings, logs: S.logs}));
    return true;
  } catch (e) {
    toast("This device’s storage is full or blocked. Export your data in Settings.", "bad");
    return false;
  }
}
async function put(coll, id, data){
  const prev = coll === "settings" ? S.settings : S[coll][id];
  if (coll === "settings") S.settings = data; else S[coll][id] = data;
  render();
  if (S.mode === "cloud") {
    try {
      if (coll === "settings") await db.doc("pos/settings").set(data);
      else await db.collection(coll).doc(id).set(data);
      setSync("ok");
    } catch (e) {
      setSync("err");
      if (coll === "settings") S.settings = prev || {}; else if (prev === undefined) delete S[coll][id]; else S[coll][id] = prev;
      render();
      if (e && e.code === "invalid_argument") toast("This account can’t save here. Open the app signed in as the owner.", "bad");
      else if (e && e.code === "quota_exceeded") toast("Storage is full. Export your data, then remove old orders.", "bad");
      else toast("Not saved. Check the internet connection and try again.", "bad");
      throw e;
    }

    try { await localWrite(coll, id, data); }
    catch (e) {
      if (coll === "settings") S.settings = prev || {}; else if (prev === undefined) delete S[coll][id]; else S[coll][id] = prev;

      throw e;
    }
  }
}
async function removeDoc(coll, id){
  const prev = S[coll][id];

    try { await db.collection(coll).doc(id).delete(); setSync("ok"); }
    catch (e) { setSync("err"); toast("Not deleted. Check the internet connection.", "bad"); }
  } else {
    try { await localWrite(coll, id, null, true); }
    catch (e) { S[coll][id] = prev; render(); toast("Not deleted: couldn’t write to this device.", "bad"); }

let pinFails = 0, pinLockUntil = 0;
/* Owner PIN: asked before every saved change. Resolves true when the PIN matches (or none is set). */
function pinOk(){
  const pin = String(cfg().pin || "");
  if (!pin) return Promise.resolve(true);
  return new Promise(resolve => {
    const layer = document.createElement("div");
    layer.className = "pin-layer";
    layer.innerHTML = `<div class="scrim" data-pincancel></div><div class="modal" role="dialog" aria-modal="true" aria-label="Owner PIN">
      <div class="m-head"><h2>Owner PIN</h2><button class="x" data-pincancel>Cancel</button></div>
      <div class="m-body"><p class="note">Enter the owner PIN to save this change.</p>
      ${numField("pin", {label: "Owner PIN", big: true}).replace("data-nf=", 'data-raw="1" data-nf=')}
      <p class="hint" id="pin-msg" aria-live="polite"></p>${padHTML()}</div></div>`;
    document.body.appendChild(layer);
    const m = layer.querySelector(".modal");
    const done = ok => { layer.remove(); resolve(ok); };
    layer.addEventListener("click", e => { if (e.target.closest("[data-pincancel]")) done(false); });
    const keysEls = [...m.querySelectorAll(".pkey")], msg = $("#pin-msg", m);
    const lockTick = () => {
      const left = Math.ceil((pinLockUntil - Date.now()) / 1000);
      const locked = left > 0;
      keysEls.forEach(k => { k.disabled = locked || (k.dataset.k === "."); });
      if (locked) { msg.textContent = `Too many wrong tries. Try again in ${left} s.`; setTimeout(() => { if (m.isConnected) lockTick(); }, 500); }
      else if (/Too many/.test(msg.textContent)) msg.textContent = "";
    };
    attachPad(m, api => {
      if (Date.now() < pinLockUntil) { api.set("pin", ""); return; }
      const v = api.raw("pin");
      if (v.length < pin.length) { if (v.length && !/Too many/.test(msg.textContent)) msg.textContent = ""; return; }
      if (v === pin) { pinFails = 0; done(true); return; }
      api.set("pin", "");
      if (++pinFails >= 5) { pinFails = 0; pinLockUntil = Date.now() + 30000; lockTick(); }
      else msg.textContent = `That PIN doesn’t match. ${5 - pinFails} ${5 - pinFails === 1 ? "try" : "tries"} left before a short wait.`;
    });
    lockTick();
  });
}
function requirePin(cb){ pinOk().then(ok => { if (ok) cb(); }); }

function addToCart(id){
  const p = S.products[id]; if (!p) return;
  const at = S.cart.findIndex(x => x.id === id);
  if (at >= 0 && tapToggles()) {
    const [line] = S.cart.splice(at, 1);
    render();
    undoToast(`Removed ${line.qty > 1 ? line.qty + " × " : ""}${line.name}`, () => {
      if (S.cart.some(x => x.id === id)) return;
      const q = Math.min(line.qty, Number((S.products[id] || {}).stock) || 0); if (q <= 0) return;
      S.cart.splice(Math.min(at, S.cart.length), 0, Object.assign({}, line, {qty: q})); render();
    });
    return;
  }
  const avail = (Number(p.stock) || 0) - inCart(id);
  if (avail <= 0) { toast(`No more ${p.name} in stock.`, "bad"); return; }
  const l = S.cart.find(x => x.id === id);
  if (l) l.qty++; else S.cart.push({id, name: p.name, price: Number(p.price) || 0, qty: 1});
  render();
}
function changeQty(id, d){
  const l = S.cart.find(x => x.id === id); if (!l) return;
  if (d > 0) { const p = S.products[id]; if (p && l.qty >= (Number(p.stock) || 0)) { toast(`Only ${p.stock} ${p.name} in stock.`, "bad"); return; } }
  l.qty += d;
  if (l.qty <= 0) S.cart = S.cart.filter(x => x.id !== id);
  render();
}

/* Number pad: one keypad drives every number box in a modal */
function padHTML(){
  const keys = ["7", "8", "9", "4", "5", "6", "1", "2", "3", "00", "0", "."];
  return `<div class="pad" role="group" aria-label="Number pad">
    <button type="button" class="pkey side" data-k="back" aria-label="Delete last digit">⌫</button>
    <button type="button" class="pkey side" data-k="clear">Clear</button>
    ${keys.map(k => `<button type="button" class="pkey num" data-k="${k}"${k === "." ? ' aria-label="Decimal point"' : ""}>${k}</button>`).join("")}
  </div>`;
}
function numField(id, opts){
  opts = opts || {};
  const v = opts.value == null || opts.value === "" ? "" : String(opts.value);
  return `<button type="button" class="numfield num ${opts.big ? "big" : ""}" data-nf="${id}" data-dec="${opts.decimals ? 1 : 0}" data-v="${esc(v)}" aria-label="${esc(opts.label || id)}">${opts.prefix ? `<i>${opts.prefix}</i>` : ""}<b></b></button>`;
}
function padPress(v, k, dec, raw){
  if (k === "clear") return "";
  if (k === "back") return v.slice(0, -1);
  if (raw) return k === "." ? v : (v + k).slice(0, 6);
  if (k === ".") { if (!dec || v.includes(".")) return v; return (v === "" ? "0" : v) + "."; }
  if (v.includes(".")) { const room = 2 - v.split(".")[1].length; return room > 0 ? v + k.slice(0, room) : v; }
  const n = (v + k).replace(/^0+(?=\d)/, "");
  return n.length > 8 ? v : n;
}
function padFmt(v){
  if (v === "") return "0";
  const parts = v.split(".");
  return Number(parts[0] || 0).toLocaleString("en-PH") + (v.includes(".") ? "." + parts[1] : "");
}
function attachPad(m, onChange){
  const fields = [...m.querySelectorAll("[data-nf]")];
  const st = {};
  fields.forEach(f => { st[f.dataset.nf] = f.dataset.v || ""; });
  let active = (fields.find(f => f.dataset.start) || fields[0] || {}).dataset?.nf;
  const dot = m.querySelector('.pkey[data-k="."]');
  const isDec = id => { const f = fields.find(x => x.dataset.nf === id); return !!f && f.dataset.dec === "1"; };
  const isRaw = id => { const f = fields.find(x => x.dataset.nf === id); return !!f && f.dataset.raw === "1"; };
  const paint = () => {
    fields.forEach(f => {
      const v = st[f.dataset.nf];
      f.querySelector("b").textContent = f.dataset.raw === "1" ? "•".repeat(v.length) : padFmt(v);
      f.classList.toggle("active", f.dataset.nf === active);
      f.classList.toggle("empty", v === "");
    });
    if (dot) dot.disabled = !isDec(active);
  };
  const press = k => { if (!active) return; st[active] = padPress(st[active], k, isDec(active), isRaw(active)); paint(); onChange && onChange(api); };
  m.addEventListener("click", e => {
    const f = e.target.closest("[data-nf]");
    if (f) { active = f.dataset.nf; paint(); return; }
    const k = e.target.closest(".pkey");
    if (k && !k.disabled) press(k.dataset.k);
  });
  const onKey = e => {
    if (!m.isConnected) { document.removeEventListener("keydown", onKey); return; }
    if (document.querySelector(".pin-layer") && !m.closest(".pin-layer")) return;
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === ".") press(".");
    else if (e.key === "Backspace") { e.preventDefault(); press("back"); }
  };
  document.addEventListener("keydown", onKey);
  const api = {
    num: id => parseFloat(st[id]) || 0,
    raw: id => st[id],
    set: (id, v) => { st[id] = v === "" || v == null ? "" : String(v); paint(); },
    focus: id => { active = id; paint(); }
  };
  paint();
  return api;
}

/* Plus/minus counters; hold a button to keep counting */
function stepField(id, v, label){
  return `<div class="stepper-row"><button type="button" class="stepbtn" data-sid="${id}" data-d="-1" aria-label="${esc(label)}: one less">−</button><div class="numfield big num" style="cursor:default" data-sv="${id}" aria-live="polite" aria-label="${esc(label)}"><b>${v}</b></div><button type="button" class="stepbtn" data-sid="${id}" data-d="1" aria-label="${esc(label)}: one more">+</button></div>`;
}
function bindSteppers(m, vals){
  let timer = null, rep = null;
  const step = b => { const id = b.dataset.sid; vals[id] = Math.max(0, vals[id] + Number(b.dataset.d)); m.querySelector(`[data-sv="${id}"] b`).textContent = vals[id]; };
  const stop = () => { clearTimeout(timer); clearInterval(rep); timer = rep = null; };
  m.addEventListener("pointerdown", e => {
    const b = e.target.closest("[data-sid]"); if (!b) return;
    e.preventDefault(); stop(); step(b);
    timer = setTimeout(() => { rep = setInterval(() => step(b), 70); }, 420);
    window.addEventListener("pointerup", stop, {once: true});
    window.addEventListener("pointercancel", stop, {once: true});
  });
  m.addEventListener("click", e => { const b = e.target.closest("[data-sid]"); if (b && e.detail === 0) step(b); });
}

const refMode = () => cfg().refMode === "manual" ? "manual" : "auto";
const refKey = r => String(r || "").replace(/[\s-]+/g, "").toUpperCase();

  return orderList().find(o => o.method === "qr" && o.status !== "void" && refKey(o.qrRef) === k) || null;
}
const PROOF_PROMPT = `The image is a photo or screenshot of a payment confirmation from a Philippine bank or e-wallet app (for example GoTyme, GCash, Maya, BPI, BDO, UnionBank, InstaPay or QR Ph).
Read it and reply with only a JSON object with exactly these keys:
"reference": the transaction reference number (also called Ref. No., reference ID, transaction ID or trace number) exactly as printed, letters and digits only with spaces removed, as a string; null if none is clearly visible.
"amount": the amount sent in Philippine pesos as a number; null if unclear.
"app": the bank or e-wallet name shown; null if unclear.
"datetime": the date and time shown, as printed; null if none.
"successful": true if it shows a completed or successful transfer, false if it shows failed, pending or cancelled, null if unclear.
Do not guess. Use null for anything you cannot read clearly.`;
/* Offline app: open-source Tesseract OCR running on the device (no internet, no Claude) */
const OFFLINE = !!window.POS_OFFLINE;
let ocrWorker = null;
const ocrAvailable = () => !!(OFFLINE && window.Tesseract);

}
function parseProof(text){
  const raw = String(text || ""), lines = raw.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const KEY = /\b(ref(erence)?|transaction|trans\.?|trace|txn|invoice|confirmation)\b\s*(no\.?|number|num|id|code|#)?/i;

    const cands = (String(str).match(/[A-Z0-9](?:[A-Z0-9]|[ \-](?=[A-Z0-9])){5,}/gi) || []).map(c => c.replace(/[ \-]/g, ""));
    const good = cands.map(c => {
      const digits = (c.match(/\d/g) || []).length;
      if (digits / c.length >= .7) c = c.replace(/[Oo]/g, "0").replace(/[Il|]/g, "1");
      return c;
    }).filter(c => c.length >= 6 && c.length <= 32 && (c.match(/\d/g) || []).length >= 5);

    const m = lines[i].match(KEY);

  if (amtLine) { const m = amtLine.match(/([0-9]{1,3}(?:,[0-9]{3})+(?:\.[0-9]{2})?|[0-9]+\.[0-9]{2})/); if (m) amount = Number(m[1].replace(/,/g, "")); }

  const ok = /\b(failed|pending|declined|unsuccessful|cancell?ed)\b/i.test(raw) ? false : /\b(successful|success|sent|completed|complete|paid|received)\b/i.test(raw) ? true : null;
  const apps = ["GoTyme", "GCash", "Maya", "PayMaya", "BPI", "BDO", "UnionBank", "Metrobank", "Landbank", "RCBC", "Security Bank", "PNB", "ShopeePay", "Coins.ph", "Seabank", "CIMB", "Tonik", "InstaPay", "PESONet", "QR Ph"];

}
async function ocrPrep(file){
  const img = await new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("img")); }; i.src = u; });

  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  const x = c.getContext("2d"); x.filter = "grayscale(1) contrast(1.4)"; x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
async function readProof(file){
  if (ocrAvailable()) {
    try {
      const w = await getOcr(), c = await ocrPrep(file);
      const r = await w.recognize(c);
      const d = parseProof(r && r.data && r.data.text);
      return {data: d};
    } catch (e) { return {err: "ocr"}; }
  }
  if (!sampleFn) return {err: "unavailable"};
  try { const lim = await sampleFn.limits(); if (!lim || !lim.images) return {err: "unavailable"}; } catch (e) { return {err: "unavailable"}; }
  let blob;
  try { blob = await compressImage(file, 1400, .85); } catch (e) { return {err: "image"}; }
  try {
    const d = await sampleFn.json(PROOF_PROMPT, {images: [blob], modelTier: "quick"});
    if (!d || typeof d !== "object") return {err: "failed"};
    const ref = d.reference == null ? "" : String(d.reference).replace(/\s+/g, "");
    const amount = d.amount == null || isNaN(Number(d.amount)) ? null : Number(d.amount);
    return {data: {ref, amount, app: d.app || "", when: d.datetime || "", ok: d.successful}};
  } catch (e) { return {err: (e && e.code) || "failed"}; }
}

}

const canShareFiles = (() => { try { return !!(navigator.canShare && navigator.canShare({files: [new File(["x"], "x.png", {type: "image/png"})]})); } catch (e) { return false; } })();
async function shareSlip(o, toPrinter){
  try {
    const cv = toPrinter ? await printCanvas(o) : await slipCanvas(o);
    const blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("png")), "image/png"));
    await navigator.share({files: [new File([blob], `order-${o.no}.png`, {type: "image/png"})], title: `Order ${o.no}`});

  } catch (e) { if (!(e && e.name === "AbortError")) toast("Sharing isn’t available here. Use Save image instead.", "bad"); }
}
async function fulfillOrder(o){
  const cur = S.orders[o.id] || o;
  if (cur.fulfilledAt || cur.status === "void") return cur;
  const upd = Object.assign({}, cur, {fulfilledAt: Date.now()});
  try {
    const cv = await slipCanvas(upd, {record: true});
    const blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("jpg")), "image/jpeg", .9));
    upd.slip = await storeImage(blob, 1400, .85);
  } catch (e) { /* the order is still marked; the slip can be regenerated */ }
  try { await put("orders", o.id, upd); } catch (e) { return null; }
  await logAdd([{type: "fulfill", ref: o.no, note: o.customer || ""}]);
  toast(`Order ${o.no} fulfilled. Slip saved to its record.`, "ok");
  if (cfg().slipCopy !== false) saveSlipImage(upd, true);
  return upd;
}
async function unfulfillOrder(o){
  if (!(await pinOk())) return null;
  const upd = Object.assign({}, S.orders[o.id] || o); delete upd.fulfilledAt; delete upd.slip;
  try { await put("orders", o.id, upd); } catch (e) { return null; }
  await logAdd([{type: "unfulfill", ref: o.no}]);
  toast(`Order ${o.no} moved back to “to fulfill”.`);

}
function showSlip(o, fresh){

  openModal(mHead(fresh ? "Payment confirmed" : "Order " + esc(o.no)) + `<div class="m-body">${slipHTML(o)}

    ${live && o.fulfilledAt ? `<div class="btn-row">${o.slip ? `<button class="btn ghost" data-viewslip>View saved slip</button>` : ""}<button class="btn ghost" data-print>Reprint slip</button><button class="btn ghost" data-unfulfill>Undo fulfilled</button></div>` : ""}

        if (fb) { fb.disabled = true; fb.textContent = "Saving…"; const u = await fulfillOrder(o); if (u) showSlip(u, false); else { fb.disabled = false; fb.textContent = "Mark as fulfilled"; } }
        if (e.target.closest("[data-unfulfill]")) { const u = await unfulfillOrder(o); if (u) showSlip(u, false); }

function openVoid(o){
  openModal(mHead("Void order " + esc(o.no)) + `<div class="m-body">
    <p class="note">This marks the order as voided, removes it from sales and puts the items back in stock. The slip stays on file.</p>
    <label class="field"><span>Reason</span><textarea id="why" placeholder="e.g. customer cancelled, wrong item tapped" autofocus></textarea></label>
    <button class="btn danger big" id="go" disabled>Void order</button></div>`, {onMount(m){
      const why = $("#why", m), go = $("#go", m);

          const moves = [];
          for (const it of o.items) {
            const p = S.products[it.pid]; if (!p) continue;
            const from = Number(p.stock) || 0;
            await put("products", p.id, Object.assign({}, p, {stock: from + it.qty}));
            moves.push({type: "void", pid: p.id, name: p.name, from, to: from + it.qty, delta: it.qty, ref: o.no, note: why.value.trim()});

          await logAdd(moves);
          closeModal(); toast(`Order ${o.no} voided.`, "ok");

}

/* Orders */

/* Dashboard */
function viewDash(){
  const now = Date.now(), today0 = startOfDay(now);
  const P = S.ui.period, days = P === "today" ? 1 : P === "7" ? 7 : 30;
  const from = today0 - (days - 1) * 864e5, to = today0 + 864e5;
  const vlist = vendorList(), multi = vlist.length > 1;
  if (!multi || (S.ui.dSeller !== "all" && !vlist.some(v => v.id === S.ui.dSeller))) S.ui.dSeller = "all";
  const VF = S.ui.dSeller;
  const mine = it => VF === "all" || lineVendor(it) === VF;
  const amtOf = o => VF === "all" ? o.total : round2(o.items.filter(mine).reduce((s, i) => s + i.qty * i.price, 0));
  const orders = paidIn(from, to).filter(o => o.items.some(mine));

  let settle = "";
  if (multi && VF === "all") {
    const rowsV = vlist.map(v => {
      let n = 0, amt = 0, c = 0, d = 0;
      orders.forEach(o => o.items.forEach(i => { if (lineVendor(i) !== v.id) return; const a = i.qty * i.price; n += i.qty; amt += a; if (o.method === "cash") c += a; else d += a; }));
      return `<tr><td><span class="t-seller" style="--v:${vendorColor(v.id)};color:var(--ink)"><i></i>${esc(v.name)}</span></td><td>${n}</td><td>${peso(c)}</td><td>${peso(d)}</td><td class="end">${peso(amt)}</td></tr>`;
    }).join("");
    settle = `<div class="card c-12"><h2>Sales by seller</h2><div class="scrollx"><table class="sumtab num"><thead><tr><th>Seller</th><th>Items</th><th>Paid in cash</th><th>Paid digitally</th><th>Total</th></tr></thead><tbody>${rowsV}</tbody></table></div>
      <p class="note" style="margin-top:10px">Use this to settle up after a collab: it shows how much of each seller’s sales came in as cash and how much went to your digital accounts.</p></div>`;
  }

  let buckets = [];

    const hrs = orders.map(o => new Date(o.createdAt).getHours());
    const lo = Math.min(8, ...(hrs.length ? hrs : [8])), hi = Math.max(20, ...(hrs.length ? hrs : [20]));
    for (let h = lo; h <= hi; h++) buckets.push({label: (h % 12 || 12) + (h < 12 ? "a" : "p"), v: orders.filter(o => new Date(o.createdAt).getHours() === h).reduce((s, o) => s + amtOf(o), 0)});
  } else {
    for (let i = 0; i < days; i++) {
      const d0 = from + i * 864e5, k = dayKey(d0 + 36e5);
      const d = new Date(d0 + 36e5);
      buckets.push({label: days <= 7 ? d.toLocaleDateString("en-PH", {weekday: "short"}) : (d.getDate() === 1 || i % 5 === 0 ? d.getDate() : ""), v: orders.filter(o => o.day === k).reduce((s, o) => s + amtOf(o), 0), title: k});
    }
  }

  const bars = buckets.map(b => `<div class="bar ${b.v ? "" : "zero"}" title="${esc(b.title || b.label)}: ${peso(b.v)}"><i style="height:${Math.max(1, b.v / maxB * 100)}%"></i><small>${b.label}</small></div>`).join("");

  const by = {};
  orders.forEach(o => o.items.filter(mine).forEach(i => { const k = i.pid || i.name; by[k] = by[k] || {name: i.name, qty: 0, amt: 0, cat: (S.products[i.pid] || {}).category}; by[k].qty += i.qty; by[k].amt += i.qty * i.price; }));
  const best = Object.values(by).sort((a, b) => b.qty - a.qty).slice(0, 8);
  const maxQ = Math.max(1, ...best.map(b => b.qty));

  const watch = productList().filter(p => (VF === "all" || (p.vendor || HOUSE) === VF) && p.active !== false && (Number(p.stock) || 0) <= lowAt(p)).sort((a, b) => a.stock - b.stock);

  const todayCash = paidIn(today0, to).filter(o => o.method === "cash").reduce((s, o) => s + o.total, 0);
  const closings = Object.values(S.closings).sort((a, b) => b.day < a.day ? -1 : 1).slice(0, 7);
  const tc = S.closings[dayKey(now)];
  const seg = [["today", "Today"], ["7", "Last 7 days"], ["30", "Last 30 days"]].map(([v, l]) => `<button data-act="period" data-v="${v}" aria-pressed="${P === v}">${l}</button>`).join("");

  return `<section class="page">
    <div class="page-head"><h1>Dashboard</h1><div class="seg" role="group" aria-label="Period">${seg}</div></div>
    ${multi ? `<div class="cats sellers" role="group" aria-label="Seller" style="margin-bottom:14px">${[{id: "all", name: "All sellers"}].concat(vlist).map(v => `<button class="cat seller" data-act="dseller" data-v="${esc(v.id)}" aria-pressed="${VF === v.id}">${esc(v.name)}</button>`).join("")}</div>` : ""}
    <div class="dash">

        <div class="kpi"><span>Orders</span><b class="num">${orders.length}</b></div>

        <div class="kpi"><span>Items sold</span><b class="num">${items}</b></div>

      <div class="card c-6"><h2>Running low</h2>${watch.length ? watch.map(p => `<div class="mini"><span>${esc(p.name)}</span>${(Number(p.stock) || 0) <= 0 ? `<span class="pill out">Sold out</span>` : `<span class="pill low num">${p.stock} left</span>`}</div>`).join("") : `<p class="note">Everything is well stocked.</p>`}

        ${tc ? `<div class="mini"><span>Counted at close (${fmtTime(tc.at)})</span><b class="num">${peso(tc.counted)}</b></div><div class="mini"><span>Difference</span><span class="${Math.abs(tc.diff) < .01 ? "diff-ok" : "diff-bad"} num">${tc.diff > 0 ? "+" : ""}${peso(tc.diff)}${Math.abs(tc.diff) < .01 ? ", balanced" : tc.diff > 0 ? " over" : " short"}</span></div>` : ""}

function openCloseDay(){
  const now = Date.now(), k = dayKey(now), today0 = startOfDay(now);
  const cashSales = paidIn(today0, today0 + 864e5).filter(o => o.method === "cash").reduce((s, o) => s + o.total, 0);
  const prev = S.closings[k] || {};
  openModal(mHead("Count today’s cash") + `<div class="m-body">
    <div class="row2">
      <div class="field"><span>Starting cash (float)</span>${numField("float", {prefix: "₱", decimals: true, value: prev.float != null ? prev.float : "", label: "Starting cash"})}</div>
      <div class="field"><span>Cash sales today</span><div class="numfield num" style="cursor:default;opacity:.7"><i>₱</i><b>${round2(cashSales).toLocaleString("en-PH")}</b></div></div>
    </div>
    <div class="field"><span>Cash counted in the drawer</span>${numField("counted", {prefix: "₱", decimals: true, value: prev.counted != null ? prev.counted : "", label: "Cash counted"}).replace("data-nf=", "data-start=\"1\" data-nf=")}</div>
    <div class="change" id="res"></div>
    ${padHTML()}
    <label class="field"><span>Note</span><input id="cnote" value="${esc(prev.note || "")}" placeholder="Optional" autocomplete="off"></label>
    <button class="btn banana big" id="save">Save count</button></div>`, {onMount(m){
      const res = $("#res", m);
      let pad;
      const calc = () => {
        const exp = round2(pad.num("float") + cashSales);
        if (pad.raw("counted") === "") { res.innerHTML = `<span>Expected in drawer</span><strong class="num">${peso(exp)}</strong>`; return null; }
        const c = round2(pad.num("counted")), d = round2(c - exp);
        res.innerHTML = `<span>${Math.abs(d) < .01 ? "Balanced" : d > 0 ? "Over by" : "Short by"}</span><strong class="num ${Math.abs(d) < .01 ? "ok" : "bad"}">${peso(Math.abs(d))}</strong>`;
        return {exp, c, d};
      };
      pad = attachPad(m, calc); calc();
      $("#save", m).onclick = async () => {
        const r = calc(); if (!r) { toast("Enter the cash you counted first.", "bad"); return; }
        if (!(await pinOk())) return;
        try {
          await put("closings", k, {day: k, at: Date.now(), float: round2(pad.num("float")), cashSales: round2(cashSales), expected: r.exp, counted: r.c, diff: r.d, note: $("#cnote", m).value.trim()});
          await logAdd([{type: "cash", note: `Counted ${peso(r.c)}, expected ${peso(r.exp)}, ${Math.abs(r.d) < .01 ? "balanced" : (r.d > 0 ? "over by " : "short by ") + peso(Math.abs(r.d))}`}]); closeModal(); toast("Cash count saved.", "ok");
        } catch (e) {}
      };
    }});
}

/* Stock */

/* ---------- backup & restore ---------- */
async function saveFile(name, data, mime){
  if (downloads) {
    try { await downloads.save({filename: name, data}); return true; }
    catch (e) { if (e && e.code === "declined") return false; }
  }
  try {
    const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type: mime}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    return true;
  } catch (e) { return false; }
}
async function buildBackup(){
  const inline = async ref => {
    if (!ref || ref.kind !== "asset") return ref;
    try { const r = await fetch("/_blob/" + ref.id); if (!r.ok) return ref; return {kind: "data", src: await blobToDataURL(await r.blob())}; } catch (e) { return ref; }
  };
  let orders = S.orders, logs = S.logs;
  if (S.mode === "cloud") {
    try { const a = await db.collection("orders").get(); orders = {}; a.docs.forEach(d => { orders[d.id] = Object.assign({}, d.data(), {id: d.id}); }); } catch (e) {}
    try { const a = await db.collection("logs").get(); logs = {}; a.docs.forEach(d => { logs[d.id] = Object.assign({}, d.data()); }); } catch (e) {}
  }
  const outOrders = {};
  for (const [k, o] of Object.entries(orders)) outOrders[k] = o.proof ? Object.assign({}, o, {proof: await inline(o.proof)}) : o;
  const settings = Object.assign({}, S.settings);
  if (settings.qr) settings.qr = await inline(settings.qr);
  if (Array.isArray(settings.qrs)) settings.qrs = await Promise.all(settings.qrs.map(async q => Object.assign({}, q, {ref: await inline(q.ref)})));
  if (settings.logo) settings.logo = await inline(settings.logo);
  if (Array.isArray(settings.vendors)) settings.vendors = await Promise.all(settings.vendors.map(async v => v.logo ? Object.assign({}, v, {logo: await inline(v.logo)}) : v));
  for (const [k, o] of Object.entries(outOrders)) if (o.slip) outOrders[k] = Object.assign({}, o, {slip: await inline(o.slip)});
  delete settings.lastBackup;
  if (settings.gdrive) settings.gdrive = {clientId: settings.gdrive.clientId || ""};
  const data = {app: "rngwillbake-pos", version: 1, made: Date.now(), products: S.products, orders: outOrders, closings: S.closings, settings, logs};
  return {json: JSON.stringify(data), orders: Object.keys(outOrders).length};
}
async function makeBackup(){
  toast("Preparing backup…");
  const {json, orders: nOrders} = await buildBackup();
  const outOrders = {length: nOrders};
  const ok = await saveFile(`rngwillbake-backup-${dayKey(Date.now())}.json`, json, "application/json");
  if (!ok) { toast("Couldn’t save the backup file on this device.", "bad"); return; }
  try { await put("settings", null, Object.assign({}, S.settings, {lastBackup: Date.now()})); } catch (e) {}
  toast(`Backup saved: ${plural(nOrders, "order")}, ${plural(Object.keys(S.products).length, "item")}.`, "ok");
}

function loadGis(){
  if (gisReady()) return Promise.resolve();
  if (!gisLoading) gisLoading = new Promise((res, rej) => {
    const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
    sc.onload = () => res(); sc.onerror = () => { gisLoading = null; rej(new Error("offline")); };
    document.head.appendChild(sc);
  });
  return gisLoading;
}
async function saveGd(patch){ await put("settings", null, Object.assign({}, S.settings, {gdrive: Object.assign({}, gd(), patch)})); }
const tokenValid = () => gToken && Date.now() < gTokenExp - 60000;
/* Must be called straight from a tap: Google opens a sign-in window. */
function driveSignIn(consent){
  return new Promise((res, rej) => {
    if (!gisReady()) { loadGis().catch(() => {}); rej(new Error("loading")); return; }
    const tc = google.accounts.oauth2.initTokenClient({client_id: gd().clientId, scope: GD_SCOPE,
      callback: r => { if (r && r.access_token) { gToken = r.access_token; gTokenExp = Date.now() + (Number(r.expires_in) || 3600) * 1000; res(gToken); } else rej(new Error((r && r.error) || "denied")); },
      error_callback: e => rej(new Error((e && e.type) || "popup"))});
    tc.requestAccessToken({prompt: consent ? "consent" : ""});
  });
}
async function gfetch(url, opts){
  const o = Object.assign({}, opts || {}); o.headers = Object.assign({Authorization: "Bearer " + gToken}, o.headers || {});
  const r = await fetch(url, o);
  if (r.status === 401) { gToken = null; throw new Error("auth"); }
  if (!r.ok) throw new Error("http " + r.status);
  return r;
}
async function driveFolder(){
  const id = gd().folderId;
  if (id) { try { const j = await (await gfetch(`${GD_API}/${id}?fields=id,trashed`)).json(); if (j && j.id && !j.trashed) return id; } catch (e) { if (e.message === "auth") throw e; } }
  const j = await (await gfetch(`${GD_API}?fields=id`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name: "rngwillbake POS backups", mimeType: "application/vnd.google-apps.folder"})})).json();
  await saveGd({folderId: j.id, files: {}});
  return j.id;
}
async function driveUpload(name, json, folderId, fileId){
  const init = await gfetch(fileId ? `${GD_UP}/${fileId}?uploadType=resumable&fields=id` : `${GD_UP}?uploadType=resumable&fields=id`, {
    method: fileId ? "PATCH" : "POST", headers: {"Content-Type": "application/json; charset=UTF-8", "X-Upload-Content-Type": "application/json"},
    body: JSON.stringify(fileId ? {} : {name, parents: [folderId], mimeType: "application/json"})});
  const loc = init.headers.get("Location"); if (!loc) throw new Error("upload");
  const up = await fetch(loc, {method: "PUT", headers: {"Content-Type": "application/json"}, body: json});
  if (up.status === 404 && fileId) return driveUpload(name, json, folderId, null);
  if (!up.ok) throw new Error("http " + up.status);
  return (await up.json()).id;
}
function lastChange(){
  let t = 0;
  for (const o of Object.values(S.orders)) t = Math.max(t, o.createdAt || 0, o.fulfilledAt || 0, o.voidAt || 0, o.printedAt || 0);
  for (const d of Object.values(S.logs)) for (const e of d.entries || []) t = Math.max(t, e.t || 0);
  return t;
}
const driveOn = () => OFFLINE && !!gd().clientId && !!gd().connected;
const driveDue = () => driveOn() && lastChange() > (gd().last || 0) && Date.now() - (gd().last || 0) > 2 * 36e5;
async function driveBackup(fromTap){
  if (!OFFLINE || !gd().clientId || driveBusy) return false;
  if (!navigator.onLine) { if (fromTap) toast("No internet right now. The app will back up to Google Drive when it’s back online.", "bad"); return false; }
  if (!tokenValid()) {
    if (!fromTap) { if (!S.driveTap) { S.driveTap = true; renderChrome(); } return false; }
    try { await driveSignIn(!gd().connected); }
    catch (e) { toast(e.message === "loading" ? "Getting Google sign-in ready. Tap again in a moment." : "Google sign-in didn’t finish. Try again.", "bad"); return false; }
  }
  driveBusy = true; S.driveTap = false; renderChrome();
  try {
    const {json, orders} = await buildBackup();
    const folder = await driveFolder(), day = dayKey(Date.now()), files = Object.assign({}, gd().files || {});
    files[day] = await driveUpload(`rngwillbake-backup-${day}.json`, json, folder, files[day]);
    const days = Object.keys(files).sort(), old = days.slice(0, Math.max(0, days.length - 30));
    for (const k of old) { try { await gfetch(`${GD_API}/${files[k]}`, {method: "DELETE"}); } catch (e) {} delete files[k]; }
    await saveGd({connected: true, files, last: Date.now()});
    if (fromTap) toast(`Backed up to Google Drive (${plural(orders, "order")}).`, "ok");
    return true;
  } catch (e) {
    if (e.message === "auth") { S.driveTap = true; if (fromTap) toast("Google asked to sign in again. Tap “Back up to Drive” once more.", "bad"); }
    else if (fromTap) toast("Couldn’t back up to Google Drive just now. It will try again later.", "bad");
    return false;
  } finally { driveBusy = false; renderChrome(); }
}
function startDriveWatch(){
  if (!OFFLINE) return;
  if (gd().clientId && navigator.onLine) loadGis().catch(() => {});
  const tick = () => { if (driveDue()) driveBackup(false); };
  setInterval(tick, 5 * 6e4);
  addEventListener("online", () => { if (gd().clientId) loadGis().catch(() => {}); setTimeout(tick, 3000); });
  setTimeout(tick, 8000);
}
async function restoreBackup(file){
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { d = null; }
  if (!d || d.app !== "rngwillbake-pos") { toast("That file isn’t a backup from this app.", "bad"); return; }
  const n = k => Object.keys(d[k] || {}).length;
  openModal(mHead("Restore backup") + `<div class="m-body">
    <p class="note">Backup from ${fmtDateTime(d.made)}: ${plural(n("orders"), "order")}, ${plural(n("products"), "item")}, ${plural(n("closings"), "cash count")}.</p>
    <p class="note">Records in the backup are added to this device. Ones with the same ID are replaced with the backup’s copy; nothing else is deleted. Settings, QR codes, sellers and the owner PIN come from the backup.</p>
    <p class="hint" id="rprog" aria-live="polite"></p>
    <button class="btn ink big" id="rgo">Restore</button></div>`, {onMount(m){
      $("#rgo", m).onclick = async () => {
        if (!(await pinOk())) return;
        const btn = $("#rgo", m), prog = $("#rprog", m); btn.disabled = true;
        const jobs = [];
        for (const c of ["products", "orders", "closings", "logs"]) for (const [k, v] of Object.entries(d[c] || {})) jobs.push([c, k, v]);
        let done = 0, failed = 0;
        if (S.mode !== "cloud" && idb) {
          prog.textContent = `Restoring ${jobs.length} records…`;
          try { const map = {}; jobs.forEach(([c, k, v]) => { (map[c] = map[c] || {})[k] = v; S[c][k] = v; }); await idbBulk(map); } catch (e) { failed = jobs.length; }
        } else for (const [c, k, v] of jobs) {
          S[c][k] = v;
          try { if (S.mode === "cloud") await db.collection(c).doc(k).set(v); else await localWrite(c, k, v); } catch (e) { failed++; }
          if (++done % 20 === 0) prog.textContent = `Restoring… ${done} of ${jobs.length}`;
        }
        const st = Object.assign({}, d.settings || {}, {lastBackup: Date.now()});
        S.settings = st;
        try { if (S.mode === "cloud") await db.doc("pos/settings").set(st); else await localWrite("settings", null, st); } catch (e) { failed++; }
        await logAdd([{type: "settings", note: `Backup restored from ${dayKey(d.made)} (${jobs.length} records)`}]);
        closeModal(); render();
        toast(failed ? `Restored with ${failed} records not saved. Free up space and restore again.` : "Backup restored.", failed ? "bad" : "ok");
      };
    }});
}

/* ---------- history ---------- */
const LOG_LABEL = {reprint: "Reprinted", fulfill: "Fulfilled", unfulfill: "Unfulfilled", sale: "Sold", void: "Voided", restock: "Restocked", adjust: "Stock edited", added: "Item added", deleted: "Item deleted", price: "Price changed", rename: "Renamed", item: "Item updated", settings: "Settings", cash: "Cash count"};
const LOG_KIND = {reprint: "sale", fulfill: "sale", unfulfill: "edit", sale: "sale", void: "void", restock: "stock", adjust: "stock", added: "stock", deleted: "stock", price: "edit", rename: "edit", item: "edit", settings: "edit", cash: "edit"};
async function logAdd(list){
  list = (list || []).filter(Boolean);
  if (!list.length) return;
  const now = Date.now(), k = dayKey(now), cur = S.logs[k] || {};
  const doc = {day: k, entries: (cur.entries || []).concat(list.map(e => Object.assign({t: now}, e)))};
  try { await put("logs", k, doc); } catch (e) { /* put already told the user */ }
}
function itemChanges(old, n){
  if (!old) return [{type: "added", pid: n.id, name: n.name, from: 0, to: n.stock, delta: n.stock, note: `New item at ${peso(n.price)}`}];
  const L = [], base = {pid: n.id, name: n.name}, os = Number(old.stock) || 0;
  if (old.name !== n.name) L.push(Object.assign({}, base, {type: "rename", from: old.name, to: n.name}));
  if (Number(old.price) !== Number(n.price)) L.push(Object.assign({}, base, {type: "price", from: Number(old.price) || 0, to: n.price}));
  if (os !== n.stock) L.push(Object.assign({}, base, {type: "adjust", from: os, to: n.stock, delta: n.stock - os}));
  if ((old.category || "Other") !== n.category) L.push(Object.assign({}, base, {type: "item", note: `Category: ${old.category || "Other"} → ${n.category}`}));
  if (lowAt(old) !== n.lowAt) L.push(Object.assign({}, base, {type: "item", note: `Low-stock warning: ${lowAt(old)} → ${n.lowAt}`}));
  if ((old.vendor || HOUSE) !== (n.vendor || HOUSE)) L.push(Object.assign({}, base, {type: "item", note: `Seller: ${vendorName(old.vendor)} \u2192 ${vendorName(n.vendor)}`}));
  if ((old.active !== false) !== n.active) L.push(Object.assign({}, base, {type: "item", note: n.active ? "Shown on the Sell screen" : "Hidden from the Sell screen"}));
  return L;
}
function logDetail(e){
  switch (e.type) {
    case "reprint": return [`Order ${e.ref}`, `Slip reprinted (${e.note})`];
    case "fulfill": return [`Order ${e.ref}`, "Marked fulfilled" + (e.note ? ` for ${e.note}` : "")];
    case "unfulfill": return [`Order ${e.ref}`, "Moved back to “to fulfill”"];
    case "sale": return [e.name, `Order ${e.ref}, stock ${e.from} → ${e.to}`];
    case "void": return [e.name, `Order ${e.ref} voided${e.note ? ": " + e.note : ""}, stock ${e.from} → ${e.to}`];
    case "restock": return [e.name, `Stock ${e.from} → ${e.to}`];
    case "adjust": return [e.name, `Changed in Edit item, ${e.from} → ${e.to}`];
    case "added": return [e.name, `${e.note || "New item"}, ${e.to} in stock`];
    case "deleted": return [e.name, `Deleted with ${e.from} in stock`];
    case "price": return [e.name, `${peso(e.from)} → ${peso(e.to)}`];
    case "rename": return [e.to, `Renamed from ${e.from}`];
    case "item": return [e.name, e.note];
    case "cash": return ["Cash count", e.note];
    default: return ["Settings", e.note];
  }
}
function viewHistory(){
  const k = S.ui.hDate, f = S.ui.hFilter, it = S.ui.hItem;
  const all = ((S.logs[k] || {}).entries || []).slice().sort((a, b) => a.t - b.t);
  const sum = {}, order = [];
  all.forEach(e => {
    if (!e.pid || LOG_KIND[e.type] === "edit") return;
    let r = sum[e.pid];
    if (!r) { r = sum[e.pid] = {name: e.name, start: e.from == null ? 0 : e.from, baked: 0, sold: 0, voided: 0, adj: 0, end: 0}; order.push(e.pid); }
    r.name = e.name;
    if (e.type === "restock") r.baked += e.delta || 0;
    else if (e.type === "sale") r.sold -= e.delta || 0;
    else if (e.type === "void") r.voided += e.delta || 0;
    else r.adj += (e.to || 0) - (e.from || 0);
    if (e.to != null) r.end = e.to;
  });
  const sumIds = order.filter(id => !it || id === it);
  const signed = n => n ? (n > 0 ? "+" : "−") + Math.abs(n) : "—";
  const table = sumIds.length ? `<div class="card" style="margin-bottom:14px"><h2>Stock for the day</h2><div class="scrollx"><table class="sumtab num">
      <thead><tr><th>Item</th><th>Start</th><th>Baked</th><th>Sold</th><th>Voided</th><th>Edited</th><th>End</th></tr></thead>
      <tbody>${sumIds.map(id => { const r = sum[id]; return `<tr><td>${esc(r.name)}</td><td>${r.start}</td><td>${r.baked ? "+" + r.baked : "—"}</td><td>${r.sold ? "−" + r.sold : "—"}</td><td>${r.voided ? "+" + r.voided : "—"}</td><td>${signed(r.adj)}</td><td class="end">${r.end}</td></tr>`; }).join("")}</tbody></table></div></div>` : "";
  let list = all.slice().reverse();
  if (f === "stock") list = list.filter(e => LOG_KIND[e.type] !== "edit");
  if (f === "edit") list = list.filter(e => LOG_KIND[e.type] === "edit");
  if (it) list = list.filter(e => e.pid === it);
  const names = {};
  productList().forEach(p => { names[p.id] = p.name; });
  all.forEach(e => { if (e.pid && !names[e.pid]) names[e.pid] = e.name + " (deleted)"; });
  const seg = [["all", "All"], ["stock", "Stock moves"], ["edit", "Edits"]].map(([v, l]) => `<button data-act="hfilter" data-v="${v}" aria-pressed="${f === v}">${l}</button>`).join("");
  const rows = list.map(e => { const d = logDetail(e); return `<div class="lrow"><span class="l-time">${fmtTime(e.t)}</span><span class="pill lt-${LOG_KIND[e.type] || "edit"}">${LOG_LABEL[e.type] || "Change"}</span><span class="l-what"><b>${esc(d[0])}</b><small>${esc(d[1])}</small></span>${e.delta ? `<span class="l-delta num ${e.delta > 0 ? "pos-d" : "neg-d"}">${signed(e.delta)}</span>` : "<span></span>"}</div>`; }).join("");
  return `<section class="page">
    <div class="page-head"><h1>History</h1><div class="seg" role="group" aria-label="Filter">${seg}</div></div>
    <div class="toolbar"><input type="date" id="h-date" value="${k}" aria-label="Day">
      <select id="h-item" aria-label="Item"><option value="">All items</option>${Object.keys(names).map(id => `<option value="${esc(id)}" ${id === it ? "selected" : ""}>${esc(names[id])}</option>`).join("")}</select>
      <button class="btn ghost sm" data-act="export-logs">Export history (CSV)</button></div>
    ${table}
    ${rows ? `<div class="list">${rows}</div>` : `<div class="empty">${all.length ? "Nothing matches this filter." : "Nothing recorded on this day."}</div>`}
    <p class="note" style="margin-top:14px">History records every change from the day this screen was added. Earlier changes weren’t tracked.</p>
  </section>`;
}
