$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  const t = b.dataset.tab;
  const go = () => { S.tab = t; S.cartOpen = false; render(); window.scrollTo(0, 0); };
  if (LOCKED[t]) requirePin(go); else go();
});
$("#view").addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const id = el.dataset.id, act = el.dataset.act;
  switch (act) {
    case "add": addToCart(id); break;
    case "inc": changeQty(id, 1); break;
    case "dec": changeQty(id, -1); break;
    case "cat": S.cat = el.dataset.cat; render(); break;
    case "seller": S.seller = el.dataset.v; S.cat = "All"; render(); break;
    case "dseller": S.ui.dSeller = el.dataset.v; render(); break;
    case "v-add": openSeller(null); break;
    case "v-edit": openSeller(el.dataset.id); break;
    case "v-del": {
      if (el.dataset.armed) { removeSeller(el.dataset.id); break; }
      el.dataset.armed = "1"; el.textContent = "Tap again"; break;
    }
    case "clear-cart": S.cart = []; render(); break;
    case "toggle-cart": S.cartOpen = !S.cartOpen; render(); break;
    case "pay-cash": if (S.cart.length) openCash(); break;
    case "pay-qr": if (S.cart.length) openQR(); break;
    case "goto": { const t = el.dataset.tab; const go = () => { S.tab = t; render(); }; if (LOCKED[t]) requirePin(go); else go(); break; }
    case "ofilter": S.ui.ordFilter = el.dataset.v; render(); break;
    case "open-order": { const o = S.orders[id]; if (o) showSlip(o, false); break; }
    case "period": S.ui.period = el.dataset.v; render(); break;
    case "close-day": openCloseDay(); break;
    case "new-item": openProduct(null); break;
    case "edit": openProduct(S.products[id]); break;
    case "restock": openRestock(S.products[id]); break;
    case "save-shop": {
      const shopName = $("#s-name").value.trim() || DEFAULTS.shopName, was = cfg().shopName;
      const ig = igClean($("#s-ig").value), wasIg = igClean(cfg().instagram);
      if (shopName === was && ig === wasIg) { toast("Nothing changed."); break; }
      pinOk().then(ok => {
        if (!ok) return;
        const notes = [];
        if (shopName !== was) notes.push(`Shop name: ${was} \u2192 ${shopName}`);
        if (ig !== wasIg) notes.push(`Instagram: ${wasIg ? "@" + wasIg : "(none)"} \u2192 ${ig ? "@" + ig : "(none)"}`);
        put("settings", null, Object.assign({}, S.settings, {shopName, instagram: ig})).then(() => { toast("Shop details saved.", "ok"); logAdd(notes.map(note => ({type: "settings", note}))); }).catch(() => {});
      });
      break;
    }
    case "pin-set": openPinChange(); break;
    case "drive-backup": driveBackup(true); break;
    case "gd-save": {
      const id = $("#s-gcid").value.trim();
      if (id && !/\.apps\.googleusercontent\.com$/.test(id)) { toast("That doesn’t look like a Google client ID. It ends in .apps.googleusercontent.com.", "bad"); break; }
      pinOk().then(ok => { if (ok) saveGd({clientId: id, connected: id && id === gd().clientId ? gd().connected : false}).then(() => { if (id) loadGis().catch(() => {}); toast(id ? "Client ID saved. Now tap Connect Google Drive." : "Google Drive backup turned off.", "ok"); logAdd([{type: "settings", note: id ? "Google Drive backup set up" : "Google Drive backup removed"}]); }).catch(() => {}); });
      break;
    }
    case "gd-off": pinOk().then(ok => { if (!ok) return; try { if (gToken && gisReady()) google.accounts.oauth2.revoke(gToken, () => {}); } catch (e) {} gToken = null; saveGd({connected: false}).then(() => { toast("Google Drive disconnected."); logAdd([{type: "settings", note: "Google Drive backup disconnected"}]); }).catch(() => {}); }); break;
    case "tapmode": { const v = el.dataset.v; if (v === (tapToggles() ? "toggle" : "add")) break; pinOk().then(ok => { if (ok) put("settings", null, Object.assign({}, S.settings, {tapMode: v})).then(() => logAdd([{type: "settings", note: `Second tap on an item: ${v === "toggle" ? "removes it" : "adds one more"}`}])).catch(() => {}); }); break; }
    case "refmode": { const v = el.dataset.v; if (v === refMode()) break; pinOk().then(ok => { if (ok) put("settings", null, Object.assign({}, S.settings, {refMode: v})).then(() => logAdd([{type: "settings", note: `Reference number at checkout: ${v === "auto" ? "read from photo" : "typed"}`}])).catch(() => {}); }); break; }
    case "printcopies": { const v = el.dataset.v; if (v === printCopies()) break; pinOk().then(ok => { if (ok) put("settings", null, Object.assign({}, S.settings, {printCopies: v})).then(() => logAdd([{type: "settings", note: `Print copies: ${v === "both" ? "merchant + customer" : v + " only"}`}])).catch(() => {}); }); break; }
    case "slipsize": { const v = el.dataset.v; if (v === slipSize()) break; pinOk().then(ok => { if (ok) put("settings", null, Object.assign({}, S.settings, {slipSize: v})).then(() => logAdd([{type: "settings", note: `Slip size: ${v === "regular" ? "regular printer" : v + " mm thermal"}`}])).catch(() => {}); }); break; }
    case "logo-off": pinOk().then(ok => { if (ok) put("settings", null, Object.assign({}, S.settings, {logo: null})).then(() => { toast("Logo removed."); logAdd([{type: "settings", note: "Shop logo removed"}]); }).catch(() => {}); }); break;
    case "pin-off": removePin(); break;
    case "backup": makeBackup(); break;
    case "save-acct": { const accountName = $("#s-acct").value.trim(), was = cfg().accountName || ""; pinOk().then(ok => { if (ok) put("settings", null, Object.assign({}, S.settings, {accountName})).then(() => { toast("Name saved.", "ok"); if (was !== accountName) logAdd([{type: "settings", note: `Name under QR: ${was || "(none)"} → ${accountName || "(none)"}`}]); }).catch(() => {}); }); break; }
    case "hfilter": S.ui.hFilter = el.dataset.v; render(); break;
    case "qr-add": openQrEdit(null); break;
    case "qr-edit": openQrEdit(Number(el.dataset.i)); break;
    case "qr-del": {
      if (el.dataset.armed) { removeQr(Number(el.dataset.i)); break; }
      el.dataset.armed = "1"; el.textContent = "Tap again"; break;
    }
    case "export-logs": exportCSV("logs"); break;
    case "export-orders": exportCSV("orders"); break;
    case "export-items": exportCSV("items"); break;
  }
});
$("#view").addEventListener("input", e => {
  const t = e.target;
  if (t.id === "cust") S.customer = t.value;
  else if (t.id === "note") S.note = t.value;
  else if (t.id === "o-q") { S.ui.q = t.value; render(); }
});
$("#view").addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "o-date" && t.value) { S.ui.ordDate = t.value; render(); }
  if (t.id === "h-date" && t.value) { S.ui.hDate = t.value; render(); }
  if (t.id === "h-item") { S.ui.hItem = t.value; render(); }
  const toggles = {"s-checks": ["packChecks", "Packing checkboxes"], "s-wm": ["watermark", "Logo watermark"]};
  if (toggles[t.id]) {
    const [key, label] = toggles[t.id], want = t.checked;
    if (!(await pinOk())) { t.checked = !want; return; }
    try { await put("settings", null, Object.assign({}, S.settings, {[key]: want})); await logAdd([{type: "settings", note: `${label}: ${want ? "on" : "off"}`}]); } catch (e) {}
  }
  if (t.id === "s-logo" && t.files && t.files[0]) {
    const file = t.files[0]; t.value = "";
    if (!(await pinOk())) return;
    try { const had = !!cfg().logo, ref = await storeLogo(file); await put("settings", null, Object.assign({}, S.settings, {logo: ref})); await logAdd([{type: "settings", note: had ? "Shop logo replaced" : "Shop logo added"}]); toast("Logo saved.", "ok"); }
    catch (err) { toast((err && err.message) || "Couldn’t use that image.", "bad"); }
  }
  if (t.id === "s-slipcopy") {
    const want = t.checked;
    if (!(await pinOk())) { t.checked = !want; return; }
    try { await put("settings", null, Object.assign({}, S.settings, {slipCopy: want})); await logAdd([{type: "settings", note: want ? "Slip copies on fulfil: on" : "Slip copies on fulfil: off"}]); } catch (e) {}
  }
  if (t.id === "s-restore" && t.files && t.files[0]) { const f = t.files[0]; t.value = ""; restoreBackup(f); }
  if (t.id === "s-qr" && t.files && t.files[0]) {
    if (!(await pinOk())) { t.value = ""; return; }
    toast("Uploading QR…");
    try {
      const had = !!cfg().qr;
      const ref = await storeImage(t.files[0], 1000, .92);
      await put("settings", null, Object.assign({}, S.settings, {qr: ref}));
      await logAdd([{type: "settings", note: had ? "GoTyme QR image replaced" : "GoTyme QR image added"}]);
      toast("QR code saved.", "ok");
    } catch (err) { toast((err && err.message) || "Couldn’t use that image.", "bad"); }
  }
});

/* ---------- boot ---------- */
async function startLocal(){
  await loadLocal(); S.mode = "local"; render();
  startDriveWatch();
  try {
    const bc = new BroadcastChannel("rngwillbake-pos");
    bc.onmessage = e => { if (e.data === "hello") bc.postMessage("here"); if (!S.twoOpen) { S.twoOpen = true; renderChrome(); } };
    bc.postMessage("hello");
  } catch (e) {}
}
function watchDate(){
  S.today = dayKey(Date.now());
  const tick = () => {
    const k = dayKey(Date.now());
    if (k === S.today) return;
    if (S.ui.ordDate === S.today) S.ui.ordDate = k;
    if (S.ui.hDate === S.today) S.ui.hDate = k;
    S.today = k;
    if (!$("#modal-root").classList.contains("on")) render();
  };
  setInterval(tick, 30000);
  document.addEventListener("visibilitychange", tick);
}
async function boot(){
  watchDate();
  render();
  if (!window.claude || typeof window.claude.use !== "function") { startLocal(); return; }
  window.claude.use("sample").then(x => { sampleFn = x; }).catch(() => {});
  window.claude.use("downloads").then(d => { downloads = d; }).catch(() => {});
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { startLocal(); return; }
  S.mode = "cloud"; S.sync = "connecting"; render();
  window.claude.use("assets").then(a => { assets = a; }).catch(() => {});
  const timer = setTimeout(() => { if (!S.loaded.products) { S.slow = true; render(); } }, 10000);
  const onErr = name => err => {
    setSync("err");
    S.loaded[name] = true;
    if (err && err.code === "revoked") toast("Access to saved data ended. Reload the app.", "bad");
    else toast("Couldn’t load saved " + name + ". Reload when the connection is back.", "bad");
    render();
  };
  const sub = (name, query) => query.onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { m[d.id] = Object.assign({}, d.data(), {id: d.id}); });
    S[name] = m;
    S.loaded[name] = true;
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.slow = false; if (S.sync !== "err") S.sync = "ok"; }
    render();
  }, onErr(name));
  try {
    sub("products", db.collection("products"));
    sub("orders", db.collection("orders").orderBy("createdAt", "desc").limit(1000));
    sub("closings", db.collection("closings"));
    sub("logs", db.collection("logs").orderBy("day", "desc").limit(120));
    db.doc("pos/settings").onSnapshot(snap => {
      S.settings = snap.exists ? Object.assign({}, snap.data()) : {};
      S.loaded.settings = true; render();
    }, onErr("settings"));
  } catch (e) { startLocal(); }
}
boot();
})();
</script>
